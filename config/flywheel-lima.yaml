minimumLimaVersion: 2.2.0

vmType: vz
arch: aarch64

images:
- location: https://cloud-images.ubuntu.com/releases/24.04/release-20260814/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:4a281a921b8d7db952895ab619736f10efe9f63e111fa5b5779ed18f023818aa

cpus: 6
memory: 10GiB
disk: 68GiB

mounts: []
additionalDisks: []
networks: []

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
  overVsock: true

containerd:
  system: false
  user: false

rosetta:
  enabled: false

audio:
  device: none

video:
  display: none

upgradePackages: false

# Deny automatic host port exposure. Lima's management SSH channel remains
# separately available to limactl and is bound locally by Lima.
portForwards:
- guestIP: 0.0.0.0
  guestIPMustBeZero: false
  guestPortRange: [1, 65535]
  proto: any
  ignore: true

plain: true
